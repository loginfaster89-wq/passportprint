name: Deploy to Cloudflare Pages

# Production deploy is intentionally manual. Multiple parallel Codex chats can
# push source work to main, but only the deploy owner should release a verified
# batch to Cloudflare Pages.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - 18b781983326986eac13a8402f5e0db6

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why is this production deploy being run?'
        required: true
        type: string
      expected_sha:
        description: 'Optional latest origin/main SHA to guard against deploying the wrong commit'
        required: false
        type: string

run-name: Deploy production - ${{ inputs.reason }}

permissions:
  contents: read

concurrency:
  group: cf-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy dist/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify selected commit
        if: ${{ inputs.expected_sha != '' }}
        shell: bash
        run: |
          expected="${{ inputs.expected_sha }}"
          case "$GITHUB_SHA" in
            "$expected"*) echo "Deploying expected commit $GITHUB_SHA" ;;
            *)
              echo "::error::This workflow is deploying $GITHUB_SHA, but expected $expected."
              echo "::error::Start a new manual deploy from the latest main branch commit."
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=studioprint --branch=main --commit-hash=${{ github.sha }}
